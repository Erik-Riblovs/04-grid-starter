<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Week 04 practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Hanken+Grotesk:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body class="bg-paper font-sans leading-relaxed text-ink">
    <!-- A blank page wired to the same stylesheet as index.html, and to the
         same watcher: any class you type here is built automatically.
         Use it for this week's pattern gallery, challenges and anything you
         want to break on purpose, so index.html keeps matching the guided
         build. -->
    <main>
      <section class="p-6">
        <h2 class="mb-4 text-2xl font-bold">Game Pass Prices</h2>

        <div class="grid grid-cols-3 gap-4">
          <div class="bg-white p-4 text-black">
            <h3>Basic</h3>
            <p>€5 per month</p>
            <a href="">Choose Plan</a>
          </div>

          <div class="bg-white p-4 text-black">
            <h3>Plus</h3>
            <p>€10 per month</p>
            <a href="">Choose Plan</a>
          </div>

          <div class="bg-white p-4 text-black">
            <h3>Premium</h3>
            <p>€15 per month</p>
            <a href="">Choose Plan</a>
          </div>

          <div class="col-span-3 bg-white p-4 text-black">
            <p>All plans include access to online games.</p>
          </div>
        </div>
      </section>

      <section class="p-6">
        <h2 class="mb-4 text-2xl font-bold">My Games</h2>

        <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-6">
          <div class="bg-white p-4 text-black">Zombie Survival</div>
          <div class="bg-white p-4 text-black">Speed Racing</div>
          <div class="bg-white p-4 text-black">Sky Obby</div>
          <div class="bg-white p-4 text-black">Meme Factory</div>
          <div class="bg-white p-4 text-black">Tower Escape</div>
          <div class="bg-white p-4 text-black">Island Tycoon</div>
        </div>
      </section>
    </main>
  </body>
</html>
